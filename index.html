<!DOCTYPE html>
<html>
<head>
  <title>Saldo da Carteira</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #0f172a;
      color: white;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    h1 { margin-bottom: 20px; }
    .saldo { font-size: 28px; font-weight: bold; color: #00ff99; }
  </style>
</head>
<body>

<div class="card">
  <h1>Saldo da Carteira</h1>
  <div id="saldo" class="saldo">Carregando...</div>
</div>

<script>
  const address = "0x5a52E96BAcdaBb82fd05763E25335261B270Efcb";
  const apiKey = "5CF6MGDXZDKEB2ZEIPMZ4XEYPIP2ZX3N2R";

  async function carregarSaldo() {
    const response = await fetch(
      `https://api.etherscan.io/api?module=account&action=balance&address=${address}&tag=latest&apikey=${apiKey}`
    );

    const data = await response.json();

    if (data.status === "1") {
      const saldoETH = (data.result / 1e18).toFixed(4);
      document.getElementById("saldo").innerText = saldoETH + " ETH";
    } else {
      document.getElementById("saldo").innerText = "Erro ao carregar saldo";
    }
  }

  carregarSaldo();
  setInterval(carregarSaldo, 60000);
</script>

</body>
</html>
