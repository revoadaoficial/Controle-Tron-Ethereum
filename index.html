<<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PowerMinds Club Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.4/dist/ethers.umd.min.js"></script>

<style>

body{
background:#0b0f1a;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.container{
background:#111936;
padding:20px;
border-radius:12px;
max-width:420px;
margin:auto;
margin-top:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2a5bff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#3b6cff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
}

.status{
margin-top:10px;
background:#20274f;
padding:10px;
border-radius:8px;
word-break:break-all;
}

</style>

</head>

<body>

<h2>PowerMinds Club</h2>

<div class="container">

<button id="connectBtn">Conectar Carteira</button>

<div class="status" id="address">Endereço: -</div>

<div class="status" id="balance">Saldo: -</div>

<h3>Enviar ETH</h3>

<input id="to" placeholder="Endereço destino">

<input id="amount" placeholder="Quantidade ETH">

<button id="sendBtn">Enviar ETH</button>

<div class="status" id="status"></div>

</div>


<script>

let provider;
let signer;
let userAddress;


/* BOTÃO CONECTAR */

document.getElementById("connectBtn").onclick = async function(){

if(!window.ethereum){

alert("MetaMask não instalado");

return;

}

provider = new ethers.BrowserProvider(window.ethereum);

await provider.send("eth_requestAccounts",[]);

signer = await provider.getSigner();

userAddress = await signer.getAddress();

document.getElementById("address").innerHTML =
"Endereço:<br>"+userAddress;

const balance = await provider.getBalance(userAddress);

document.getElementById("balance").innerHTML =
"Saldo: "+ethers.formatEther(balance)+" ETH";

};



/* BOTÃO ENVIAR */

document.getElementById("sendBtn").onclick = async function(){

try{

if(!signer){

alert("Conecte a carteira primeiro");

return;

}

const to = document.getElementById("to").value.trim();

const amount = document.getElementById("amount").value.trim();

if(!ethers.isAddress(to)){

alert("Endereço inválido");

return;

}

const tx = await signer.sendTransaction({

to: to,

value: ethers.parseEther(amount)

});

document.getElementById("status").innerHTML =
"Aguardando confirmação:<br>"+tx.hash;

await tx.wait();

document.getElementById("status").innerHTML =
"Enviado com sucesso:<br>"+tx.hash;

}catch(e){

document.getElementById("status").innerHTML =
"Erro:<br>"+e.message;

}

};

</script>

</body>
</html>>
