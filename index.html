<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PowerMinds Club - Web3 Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.4/dist/ethers.umd.min.js"></script>

<style>

body{
background:#0b0f1a;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.container{
background:#111936;
padding:20px;
border-radius:12px;
max-width:400px;
margin:auto;
margin-top:20px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2a5bff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3b6cff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;
}

.status{
margin-top:10px;
background:#20274f;
padding:12px;
border-radius:8px;
word-break:break-all;
}

h1{
margin-bottom:10px;
}

</style>

</head>

<body>

<h1>PowerMinds Club</h1>

<div class="container">

<button onclick="connectWallet()">Conectar Carteira</button>

<div class="status" id="network">Rede: Não conectado</div>

<div class="status" id="address">Endereço: -</div>

<div class="status" id="balance">Saldo: -</div>

<h3>Enviar ETH</h3>

<input id="to" placeholder="Endereço destino">

<input id="amount" placeholder="Quantidade ETH">

<button onclick="sendETH()">Enviar ETH</button>

<div class="status" id="sendStatus"></div>

<h3>Receber ETH</h3>

<div class="status" id="receive">Conecte a carteira</div>

</div>


<script>

let provider;
let signer;
let userAddress;


/* CONECTAR */

async function connectWallet(){

if(!window.ethereum){

alert("Instale MetaMask ou Trust Wallet");

return;

}

try{

provider=new ethers.BrowserProvider(window.ethereum);

await provider.send("eth_requestAccounts",[]);

signer=await provider.getSigner();

userAddress=await signer.getAddress();

document.getElementById("address").innerHTML="Endereço:<br>"+userAddress;

document.getElementById("receive").innerHTML=userAddress;

loadBalance();

loadNetwork();

}catch(err){

alert(err.message);

}

}


/* SALDO */

async function loadBalance(){

const balance=await provider.getBalance(userAddress);

const eth=ethers.formatEther(balance);

document.getElementById("balance").innerHTML="Saldo: "+eth+" ETH";

}


/* REDE */

async function loadNetwork(){

const network=await provider.getNetwork();

document.getElementById("network").innerHTML="Rede: "+network.name;

}


/* ENVIAR */

async function sendETH(){

try{

const to=document.getElementById("to").value;

const amount=document.getElementById("amount").value;

if(!ethers.isAddress(to)){

alert("Endereço inválido");

return;

}

if(amount<=0){

alert("Valor inválido");

return;

}

const tx=await signer.sendTransaction({

to:to,

value:ethers.parseEther(amount)

});

document.getElementById("sendStatus").innerHTML="Transação enviada:<br>"+tx.hash;

await tx.wait();

document.getElementById("sendStatus").innerHTML="Confirmado:<br>"+tx.hash;

loadBalance();

}catch(err){

document.getElementById("sendStatus").innerHTML="Erro:<br>"+err.message;

}

}


/* AUTO DETECT */

if(window.ethereum){

window.ethereum.on("accountsChanged",connectWallet);

window.ethereum.on("chainChanged",connectWallet);

}


</script>

</body>
</html>
