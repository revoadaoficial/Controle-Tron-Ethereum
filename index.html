<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerMinds Club - Carteira ETH</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: white;
}
header {
  background: linear-gradient(90deg,#0a0f2c,#101a4a);
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
.container {
  max-width: 600px;
  margin: 30px auto;
  background: #111936;
  padding: 20px;
  border-radius: 10px;
}
input, button {
  padding: 12px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}
input[type="password"], input[type="text"] {
  width: 100%;
}
button {
  background: #2a5bff;
  color: white;
  cursor: pointer;
}
button:hover {
  background: #3b6cff;
}
section {
  margin-top: 20px;
}
.status {
  margin-top: 10px;
  padding: 10px;
  background: #20274f;
  border-radius: 6px;
  min-height: 40px;
}
</style>
</head>
<body>
<header>PowerMinds Club - Carteira ETH</header>

<div class="container" id="loginContainer">
  <h2>Login</h2>
  <input type="password" id="passwordInput" placeholder="Digite sua senha">
  <button id="loginBtn">Entrar</button>
  <div class="status" id="loginStatus"></div>
</div>

<div class="container" id="walletContainer" style="display:none;">
  <h2>Carteira Ethereum</h2>
  <button id="connectBtn">Conectar Carteira</button>
  <div id="accountInfo"></div>

  <section>
    <h3>Enviar ETH</h3>
    <input type="text" id="toAddress" placeholder="Endereço destino">
    <input type="text" id="amountETH" placeholder="Quantidade ETH">
    <button id="sendBtn">Enviar</button>
    <div class="status" id="sendStatus"></div>
  </section>

  <section>
    <h3>Receber ETH</h3>
    <div id="receiveAddress"></div>
  </section>
</div>

<script type="module">
import Onboard from 'https://cdn.jsdelivr.net/npm/@web3-onboard/core@2.13.2/dist/web3-onboard.esm.js';
import injectedModule from 'https://cdn.jsdelivr.net/npm/@web3-onboard/injected-wallets@2.13.2/dist/web3-onboard-injected-wallets.esm.js';
import { ethers } from 'https://cdn.jsdelivr.net/npm/ethers@6.8.4/dist/ethers.esm.min.js';

// ==== LOGIN SIMPLES ====
const PASSWORD = "123456"; // sua senha simples
const loginBtn = document.getElementById('loginBtn');
const passwordInput = document.getElementById('passwordInput');
const loginStatus = document.getElementById('loginStatus');
const loginContainer = document.getElementById('loginContainer');
const walletContainer = document.getElementById('walletContainer');

loginBtn.addEventListener('click', () => {
  if(passwordInput.value === PASSWORD){
    loginContainer.style.display = 'none';
    walletContainer.style.display = 'block';
  } else {
    loginStatus.textContent = "Senha incorreta!";
  }
});

// ==== CONFIGURAÇÃO WEB3 ====
const injected = injectedModule();
const onboard = Onboard({
  wallets: [injected],
  chains: [{
    id: '0x1', token: 'ETH', label: 'Ethereum Mainnet', rpcUrl: 'https://mainnet.infura.io/v3/80633e48116943128cbab25e402764ab'
  }],
  appMetadata: {
    name: 'PowerMinds Club',
    icon: '<svg></svg>',
    description: 'Carteira ETH pessoal'
  }
});

// ==== CONEXÃO DA CARTEIRA ====
let currentWallet;
const connectBtn = document.getElementById('connectBtn');
const accountInfo = document.getElementById('accountInfo');
const receiveAddress = document.getElementById('receiveAddress');

connectBtn.addEventListener('click', async () => {
  const wallets = await onboard.connectWallet();
  if(wallets.length > 0){
    currentWallet = wallets[0];
    accountInfo.innerHTML = `Endereço: ${currentWallet.accounts[0].address}`;
    receiveAddress.textContent = currentWallet.accounts[0].address;
  }
});

// ==== ENVIAR ETH ====
const sendBtn = document.getElementById('sendBtn');
const toAddressInput = document.getElementById('toAddress');
const amountInput = document.getElementById('amountETH');
const sendStatus = document.getElementById('sendStatus');

sendBtn.addEventListener('click', async () => {
  if(!currentWallet) return alert("Conecte a carteira primeiro!");
  const provider = new ethers.BrowserProvider(currentWallet.provider);
  const signer = await provider.getSigner();
  const tx = await signer.sendTransaction({
    to: toAddressInput.value,
    value: ethers.parseEther(amountInput.value)
  });
  sendStatus.textContent = `Transação enviada: ${tx.hash}`;
  await tx.wait();
  sendStatus.textContent = `Transação confirmada: ${tx.hash}`;
});
</script>

</body>
</html>
