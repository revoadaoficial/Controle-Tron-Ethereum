<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PowerMinds Club - Ethereum Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.4/dist/ethers.umd.min.js"></script>

<style>

body{
background:#0b0f1a;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.container{
background:#111936;
padding:20px;
border-radius:12px;
max-width:420px;
margin:auto;
margin-top:20px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:8px;
background:#2a5bff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3b6cff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;
}

.status{
margin-top:10px;
background:#20274f;
padding:12px;
border-radius:8px;
word-break:break-all;
}

</style>

</head>

<body>

<h2>PowerMinds Club</h2>

<div class="container">

<button onclick="connectWallet()">Conectar Carteira</button>

<div class="status" id="network">Rede: Ethereum Mainnet</div>

<div class="status" id="connected">Carteira conectada: -</div>

<div class="status" id="balance">Saldo: -</div>

<div class="status">
Carteira de envio padrão:<br>
0x97b9D2102A9a65A26E1EE82D59e42d1B73B68689
</div>

<div class="status">
Carteira de autorização:<br>
0xc06d73162E9BffbCfBF1DA59C511002A8F9155E5
</div>

<h3>Enviar ETH</h3>

<input id="to" value="0x97b9D2102A9a65A26E1EE82D59e42d1B73B68689">

<input id="amount" placeholder="Quantidade ETH">

<button onclick="sendETH()">Enviar</button>

<div class="status" id="txStatus"></div>

<h3>Receber ETH</h3>

<div class="status" id="receive">Conecte sua carteira</div>

</div>


<script>

/* CONFIGURAÇÃO */

const AUTH_WALLET="0xc06d73162E9BffbCfBF1DA59C511002A8F9155E5";

const SEND_WALLET="0x97b9D2102A9a65A26E1EE82D59e42d1B73B68689";

const ETH_CHAIN_ID="0x1";


let provider;
let signer;
let userAddress;


/* CONECTAR */

async function connectWallet(){

if(!window.ethereum){

alert("Instale MetaMask");

return;

}

provider=new ethers.BrowserProvider(window.ethereum);

await provider.send("eth_requestAccounts",[]);

const network=await provider.getNetwork();

if(network.chainId!=1n){

alert("Mude para Ethereum Mainnet");

return;

}

signer=await provider.getSigner();

userAddress=await signer.getAddress();

document.getElementById("connected").innerHTML=
"Carteira conectada:<br>"+userAddress;

document.getElementById("receive").innerHTML=userAddress;

loadBalance();

}



/* SALDO */

async function loadBalance(){

const balance=await provider.getBalance(userAddress);

const eth=ethers.formatEther(balance);

document.getElementById("balance").innerHTML=
"Saldo: "+eth+" ETH";

}



/* ENVIO */

async function sendETH(){

try{

const to=document.getElementById("to").value;

const amount=document.getElementById("amount").value;

if(!ethers.isAddress(to)){

alert("Endereço inválido");

return;

}

if(amount<=0){

alert("Valor inválido");

return;

}

/* AUTORIZAÇÃO */

if(!userAddress){

alert("Conecte carteira primeiro");

return;

}

/* ENVIO TRANSAÇÃO */

const tx=await signer.sendTransaction({

to:to,

value:ethers.parseEther(amount)

});

document.getElementById("txStatus").innerHTML=
"Transação enviada:<br>"+tx.hash;

await tx.wait();

document.getElementById("txStatus").innerHTML=
"Confirmada:<br>"+tx.hash;

loadBalance();

}catch(err){

document.getElementById("txStatus").innerHTML=
"Erro:<br>"+err.message;

}

}



/* AUTO UPDATE */

if(window.ethereum){

window.ethereum.on("accountsChanged",connectWallet);

window.ethereum.on("chainChanged",connectWallet);

}

</script>

</body>
</html>
